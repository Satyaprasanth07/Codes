<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Day 6 Task</title>
</head>
<body>

    <h1>Create Your Account?</h1>
    <h2>Join Us and Get started</h2>
    <form action="">
        <label for="nm">Enter Your Full Name</label>
        <input  id="nm" placeholder="Your Name" name="yn" type="text"> <br>
        <label for="em">Enter Your Email</label>
        <input id="em" placeholder="Your Email" name="ye" type="email"> <br>
        <label for="pd">Enter Your Password</label>
        <input id="pd" placeholder="Your Password" name="pw" type="password" required> <br>
        <label for="cpd">Confirm Password</label>
        <input id="cpd" placeholder="Confirm Password" name="c" type="password" required> <br>
        Gender <br>
        <input type="radio" name="Gender" value="Male" id="Ma">
        <label for="Ma">Male</label>
        <input type="radio" name="Gender" value="Female" id="Fm" >
        <label for="Fm">Female</label>
        <input type="radio" id="Ot" value="Other" name="Gender" >
        <label for="Ot">Other</label> <br>
        Date Of Birth <br>
        <input type="date"> <br>
        <label for="country">Country:</label> <br>
        <select id="country" name="country">
        <option value="">--Select Country--</option>
        <option value="US">United States</option>
        <option value="IN">India</option>
        <option value="GB">United Kingdom</option>
        </select> <br>
        <input type="checkbox" name="Tm" >
        <label for="Tm">I agree to the Terms And Conditions</label> <br>
        <button type="submit" >Register Now</button> <br>
        Already Have an account?
        <input type="submit">
        <label for="">Login</label>

    </form>
</body>
</html>
